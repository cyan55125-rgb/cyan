<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售团队管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--bg4:#475569;
  --text:#f1f5f9;--text2:#cbd5e1;--text3:#94a3b8;--text4:#64748b;
  --primary:#10b981;--primary2:#34d399;--primary3:rgba(16,185,129,0.15);
  --amber:#f59e0b;--amber2:rgba(245,158,11,0.15);
  --red:#ef4444;--red2:rgba(239,68,68,0.15);
  --border:rgba(148,163,184,0.2);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;flex-direction:column;height:100vh}
.header{flex-shrink:0;height:64px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary2),#14b8a6);display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text h1{font-size:16px;font-weight:700;color:var(--text)}
.logo-text p{font-size:10px;color:var(--text4);text-transform:uppercase;letter-spacing:1px}
.header-actions{display:flex;align-items:center;gap:8px}
.btn{padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--primary),#14b8a6);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,0.3)}
.btn-primary:hover{box-shadow:0 6px 16px rgba(16,185,129,0.4);transform:translateY(-1px)}
.btn-amber{background:var(--amber2);color:var(--amber);border:1px solid rgba(245,158,11,0.2)}
.btn-amber:hover{background:rgba(245,158,11,0.2)}
.btn-indigo{background:rgba(99,102,241,0.1);color:#818cf8;border:1px solid rgba(99,102,241,0.2)}
.btn-indigo:hover{background:rgba(99,102,241,0.2)}
.btn-ghost{padding:6px 12px;background:transparent;color:var(--text3);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.main{display:flex;flex:1;min-height:0}
.sidebar{flex-shrink:0;width:280px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.sidebar-header p{font-size:11px;color:var(--text4);margin-top:2px}
.tree{flex:1;overflow-y:auto;padding:8px}
.tree-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:all 0.15s;color:var(--text3);font-size:13px}
.tree-item:hover{background:var(--bg2)}
.tree-item.selected{background:var(--primary3);color:var(--primary2);border:1px solid rgba(16,185,129,0.3)}
.tree-item .indent{display:inline-block}
.tree-item .toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:10px;flex-shrink:0}
.tree-item .toggle:hover{background:var(--bg3)}
.tree-item .avatar{width:24px;height:24px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.tree-item.selected .avatar{background:rgba(16,185,129,0.2);color:var(--primary)}
.tree-item .count{flex:1;text-align:right;font-size:10px;color:var(--text4)}
.content{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{display:flex;align-items:center;gap:12px}
.card-title .icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(20,184,166,0.1));border:1px solid rgba(16,185,129,0.2);display:flex;align-items:center;justify-content:center;font-size:18px}
.card-title h2{font-size:18px;font-weight:700}
.card-title .subtitle{font-size:12px;color:var(--text4);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{background:var(--bg);border-radius:8px;padding:12px;border:1px solid var(--border)}
.stat-label{font-size:10px;color:var(--text4);text-transform:uppercase;letter-spacing:1px}
.stat-value{font-size:20px;font-weight:700;margin-top:4px}
.stat-green .stat-value{color:var(--primary)}
.stat-amber .stat-value{color:var(--amber)}
.stat-teal .stat-value{color:#2dd4bf}
.filter-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.filter-label{font-size:12px;color:var(--text4)}
.filter-btn{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:var(--bg);color:var(--text3);transition:all 0.15s}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{background:var(--primary3);color:var(--primary);border:1px solid rgba(16,185,129,0.25)}
.date-input{padding:4px 8px;border-radius:6px;font-size:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none}
.date-input:focus{border-color:var(--primary)}
.sales-table{width:100%;border-collapse:collapse}
.sales-table th{text-align:left;font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;padding:12px 16px;border-bottom:1px solid var(--border)}
.sales-table td{padding:12px 16px;border-bottom:1px solid rgba(51,65,85,0.5);font-size:13px}
.sales-table tr:hover td{background:rgba(51,65,85,0.3)}
.sales-table .amount{color:var(--primary);font-weight:600;text-align:right}
.sales-table .date{color:var(--text4);font-size:12px}
.sales-table .action{width:40px}
.delete-btn{opacity:0;padding:4px;border-radius:4px;cursor:pointer;border:none;background:transparent;color:var(--text4);transition:all 0.15s}
tr:hover .delete-btn{opacity:1}
.delete-btn:hover{background:var(--red2);color:var(--red)}
.empty{text-align:center;padding:60px 20px;color:var(--text4)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.team-list{border-top:1px solid var(--border)}
.team-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(51,65,85,0.3)}
.team-item:last-child{border-bottom:none}
.team-item.self{background:var(--primary3);margin:0 -20px;padding:12px 20px;border-radius:8px}
.team-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.team-item.self .team-avatar{background:rgba(16,185,129,0.2);color:var(--primary)}
.team-item:not(.self) .team-avatar{background:var(--bg);color:var(--text4)}
.team-info{flex:1}
.team-name{font-size:13px;font-weight:500}
.team-name.self{color:var(--primary2)}
.team-detail{font-size:11px;color:var(--text4);margin-top:2px}
.team-amount{font-size:14px;font-weight:600}
.team-item.self .team-amount{color:var(--primary)}
.team-total{background:linear-gradient(135deg,rgba(16,185,129,0.1),rgba(20,184,166,0.05));border-top:1px solid rgba(16,185,129,0.2);padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.team-total .label{font-size:13px;color:var(--text3)}
.team-total .value{font-size:20px;color:var(--primary)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,0.5)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--text4);transition:all 0.15s}
.modal-close:hover{background:var(--bg3);color:var(--text)}
.modal-body{padding:20px;overflow-y:auto;max-height:calc(90vh - 60px)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px}
.form-input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:border 0.15s}
.form-input:focus{border-color:var(--primary)}
.form-input::placeholder{color:var(--text4)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:12px;margin-top:20px}
.form-actions .btn{flex:1}
.search-wrapper{position:relative}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.search-result{padding:10px 16px;cursor:pointer;font-size:13px;transition:background 0.15s}
.search-result:hover{background:var(--bg3)}
.search-result.new{color:var(--primary)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:2000}
.toast-text{font-size:13px}
.toast-action{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:var(--primary3);color:var(--primary)}
.toast-close{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--text4)}
.confirm-modal .modal{max-width:400px}
.confirm-icon{width:56px;height:56px;border-radius:50%;background:var(--red2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;color:var(--red)}
.confirm-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:8px}
.confirm-text{text-align:center;font-size:14px;color:var(--text4);margin-bottom:20px}
.confirm-name{color:var(--red);font-weight:600}
.confirm-actions{display:flex;gap:12px}
.confirm-actions .btn{flex:1}
.confirm-actions .btn-cancel{background:var(--bg3);color:var(--text3)}
.confirm-actions .btn-delete{background:linear-gradient(135deg,var(--red),#dc2626);color:#fff}
.snapshot-panel{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bg);border-left:1px solid var(--border);z-index:1000;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,0.3)}
.snapshot-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.snapshot-header h3{font-size:16px;font-weight:700}
.snapshot-list{flex:1;overflow-y:auto;padding:16px}
.snapshot-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.snapshot-name{font-size:14px;font-weight:600;margin-bottom:4px}
.snapshot-time{font-size:11px;color:var(--text4)}
.snapshot-stats{display:flex;gap:8px;margin-top:8px}
.snapshot-stat{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.snapshot-stat.green{background:var(--primary3);color:var(--primary)}
.snapshot-stat.blue{background:rgba(59,130,246,0.15);color:#60a5fa}
.snapshot-actions{display:flex;gap:8px;margin-top:10px}
.snapshot-actions button{flex:1;padding:6px;font-size:12px;border-radius:6px;cursor:pointer;border:none;font-weight:500}
.snapshot-actions .restore{background:var(--primary3);color:var(--primary)}
.snapshot-actions .delete-btn-action{background:var(--red2);color:var(--red)}
.snapshot-empty{text-align:center;padding:40px;color:var(--text4)}
.snapshot-empty-icon{font-size:32px;margin-bottom:12px;opacity:0.5}
.search-bar{flex:1;max-width:240px;position:relative}
.search-input{width:100%;height:36px;padding:0 12px 0 36px;border-radius:9999px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;outline:none}
.search-input:focus{border-color:var(--primary)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:14px}
.initial-sale{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:16px}
.initial-sale-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:1px}
.initial-sale-header span:first-child{font-size:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.animate-in{animation:fadeIn 0.2s ease-out}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--text4)}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <div class="logo-text">
        <h1>销售团队管理</h1>
        <p>Team Sales Manager</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="globalSearch" placeholder="搜索客户..." oninput="handleGlobalSearch(this.value)">
      </div>
      <button class="btn btn-indigo" onclick="openSnapshotPanel()">📷 数据快照</button>
      <button class="btn btn-amber" onclick="openAddSale()">💰 新增销售</button>
      <button class="btn btn-primary" onclick="openAddCustomer()">➕ 新增客户</button>
    </div>
  </header>
  <main class="main">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>客户列表</h2>
        <p id="customerCount">共 0 位客户</p>
      </div>
      <div class="tree" id="customerTree"></div>
    </aside>
    <section class="content" id="contentArea">
      <div class="empty">
        <div class="empty-icon">👆</div>
        <p>选择一个客户查看详情</p>
        <p style="margin-top:8px;font-size:12px">或点击上方「新增客户」开始</p>
      </div>
    </section>
  </main>
</div>

<div id="toastContainer"></div>
<div id="modalContainer"></div>
<div id="snapshotPanel" class="snapshot-panel" style="display:none">
  <div class="snapshot-header">
    <h3>📷 数据快照</h3>
    <button class="modal-close" onclick="closeSnapshotPanel()">✕</button>
  </div>
  <div style="padding:12px 16px">
    <button class="btn btn-primary" style="width:100%" onclick="createSnapshot()">📸 创建当前快照</button>
  </div>
  <div class="snapshot-list" id="snapshotList"></div>
</div>

<script>
const STORAGE_KEYS={CUSTOMERS:'sales_customers_v2',SALES:'sales_records_v2',SNAPSHOTS:'sales_snapshots_v2'};
let state={customers:[],sales:[],selectedId:null,undoAction:null,undoTimer:null,filterType:'all',customRange:null};
function load(){try{state.customers=JSON.parse(localStorage.getItem(STORAGE_KEYS.CUSTOMERS))||[]}catch{state.customers=[]}try{state.sales=JSON.parse(localStorage.getItem(STORAGE_KEYS.SALES))||[]}catch{state.sales=[]}}function saveCustomers(){localStorage.setItem(STORAGE_KEYS.CUSTOMERS,JSON.stringify(state.customers))}function saveSales(){localStorage.setItem(STORAGE_KEYS.SALES,JSON.stringify(state.sales))}
function genId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,8)}
function formatCurrency(n){return new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',minimumFractionDigits:0}).format(n)}
function formatDate(s){return new Date(s).toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'})}
function getDescendantIds(id){const ids=new Set([id]);const q=[id];while(q.length){const cid=q.shift();state.customers.filter(c=>c.parentId===cid&&!ids.has(c.id)).forEach(c=>{ids.add(c.id);q.push(c.id)})}return ids}
function getPersonalSales(cid){let s=state.sales.filter(s=>s.customerId===cid);if(state.filterType==='thisMonth'){const d=new Date(),y=d.getFullYear(),m=d.getMonth();s=s.filter(x=>{const d=new Date(x.date);return d.getFullYear()===y&&d.getMonth()===m})}else if(state.filterType==='lastMonth'){const d=new Date(),y=d.getFullYear(),m=d.getMonth()-1;const lm=m<0?11:y-1:ym=m===11?0:d.getMonth();const ly=m<0?y-1:y;s=s.filter(x=>{const d=new Date(x.date);return d.getFullYear()===ly&&d.getMonth()===lm})}else if(state.filterType==='custom'&&state.customRange){const[sd,ed]=state.customRange;s=s.filter(x=>{const t=new Date(x.date).getTime();return t>=new Date(sd).getTime()&&t<=new Date(ed+'T23:59:59').getTime()})}return s}
function getTeamSales(cid){const dids=getDescendantIds(cid);const sales=state.sales.filter(s=>dids.has(s.customerId));if(state.filterType==='thisMonth'){const d=new Date(),y=d.getFullYear(),m=d.getMonth();sales.length=0;state.sales.filter(s=>dids.has(s.customerId)&&new Date(s.date).getFullYear()===y&&new Date(s.date).getMonth()===m).forEach(s=>sales.push(s))}else if(state.filterType==='lastMonth'){const d=new Date(),y=d.getFullYear(),m=d.getMonth()-1;const lm=m<0?11:y-1;const ly=m<0?y-1:y;sales.length=0;state.sales.filter(s=>dids.has(s.customerId)&&new Date(s.date).getFullYear()===ly&&new Date(s.date).getMonth()===lm).forEach(s=>sales.push(s))}else if(state.filterType==='custom'&&state.customRange){const[sd,ed]=state.customRange;sales.length=0;state.sales.filter(s=>dids.has(s.customerId)&&new Date(s.date).getTime()>=new Date(sd).getTime()&&new Date(s.date).getTime()<=new Date(ed+'T23:59:59').getTime()).forEach(s=>sales.push(s))}const members=[];let total=0;dids.forEach(id=>{const c=state.customers.find(x=>x.id===id);const amount=sales.filter(s=>s.customerId===id).reduce((a,s)=>a+s.amount,0);members.push({id,name:c?.name||'未知',amount,count:sales.filter(s=>s.customerId===id).length})});members.forEach(m=>total+=m.amount);members.sort((a,b)=>b.amount-a.amount);return{total,members}}
function renderTree(){const tree=document.getElementById('customerTree');const selected=document.getElementById('customerCount');selected.textContent=`共 ${state.customers.length} 位客户`;if(state.customers.length===0){tree.innerHTML='<div style="padding:20px;text-align:center;color:var(--text4);font-size:13px">暂无客户<br><span style="font-size:11px">点击上方「新增客户」添加</span></div>';return}const roots=state.customers.filter(c=>!c.parentId||!state.customers.find(x=>x.id===c.parentId));const map={};state.customers.forEach(c=>{map[c.id]={...c,children:[]}});state.customers.forEach(c=>{if(c.parentId&&map[c.parentId])map[c.parentId].children.push(map[c.id])});function render(node,depth=0){const childIds=getDescendantIds(node.id);const saleCount=state.sales.filter(s=>childIds.has(s.customerId)).length;const isSelected=state.selectedId===node.id;const indent='<span class="indent">'+(depth>0?'├ ':'')+'</span>';return`<div class="tree-item ${isSelected?'selected':''}" onclick="selectCustomer('${node.id}')">${indent}<span class="toggle">${node.children.length?'▼':'·'}</span><span class="avatar">👤</span><span class="name">${escHtml(node.name)}</span>${node.children.length?`<span class="count">${node.children.length}</span>`:''}</div>${node.children.length?`<div style="padding-left:16px">${node.children.map(c=>render(c,depth+1)).join('')}</div>`:''}`}tree.innerHTML=roots.map(r=>render(map[r.id])).join('')}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function selectCustomer(id){state.selectedId=id;renderTree();renderDetail()}
function renderDetail(){const cont=document.getElementById('contentArea');if(!state.selectedId){cont.innerHTML='<div class="empty"><div class="empty-icon">👆</div><p>选择一个客户查看详情</p><p style="margin-top:8px;font-size:12px">或点击上方「新增客户」开始</p></div>';return}const c=state.customers.find(x=>x.id===state.selectedId);if(!c){cont.innerHTML='<div class="empty"><p>客户不存在</p></div>';return}const parent=state.customers.find(x=>x.id===c.parentId);const ps=getPersonalSales(state.selectedId);const pt=ps.reduce((a,s)=>a+s.amount,0);const ts=getTeamSales(state.selectedId);const filterBtns={all:'全部',thisMonth:'本月',lastMonth:'上月',custom:'自定义'};let customInputs='';if(state.filterType==='custom'){const[sd,ed]=state.customRange||['',''];customInputs=`<input type="date" class="date-input" value="${sd}" onchange="setCustomDate('start',this.value)"><span style="color:var(--text4)">至</span><input type="date" class="date-input" value="${ed}" onchange="setCustomDate('end',this.value)"><button class="filter-btn active" onclick="applyCustom()">确定</button>`}cont.innerHTML=`<div class="card"><div class="card-header"><div class="card-title"><div class="icon">👤</div><div><h2>${escHtml(c.name)}</h2>${parent?`<p class="subtitle">上级: ${escHtml(parent.name)}</p>`:'<p class="subtitle" style="color:var(--primary);font-size:11px">🌟 顶级成员</p>'}</div></div><button class="modal-close" onclick="confirmDelete('${c.id}','${escHtml(c.name)}')" title="删除此客户">🗑</button></div><div class="stats"><div class="stat stat-green"><div class="stat-label">个人销售额</div><div class="stat-value">${formatCurrency(pt)}</div></div><div class="stat stat-amber"><div class="stat-label">销售笔数</div><div class="stat-value">${ps.length}</div></div><div class="stat stat-teal"><div class="stat-label">团队总额</div><div class="stat-value">${formatCurrency(ts.total)}</div></div></div></div><div class="card"><div class="card-header"><div class="card-title"><h2 style="font-size:14px">销售记录明细</h2><span style="font-size:12px;color:var(--text4)">共 ${ps.length} 笔</span></div><button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="exportCSV()">📥 导出</button></div><div class="filter-bar"><span class="filter-label">筛选:</span>${Object.entries(filterBtns).map(([k,v])=>`<button class="filter-btn ${state.filterType===k?'active':''}" onclick="setFilter('${k}')">${v}</button>`).join('')}${customInputs}</div>${ps.length>0?`<table class="sales-table"><thead><tr><th>产品名称</th><th style="text-align:right">金额</th><th>日期</th><th class="action"></th></tr></thead><tbody>${ps.map(s=>`<tr><td>${escHtml(s.productName)}</td><td class="amount">${formatCurrency(s.amount)}</td><td class="date">${formatDate(s.date)}</td><td class="action"><button class="delete-btn" onclick="deleteSale('${s.id}')">🗑</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty" style="padding:30px"><p>暂无销售记录</p></div>'}</div>${ts.members.length>1?`<div class="card"><div class="card-title" style="padding:12px 0"><h2 style="font-size:14px">团队汇总</h2><span style="font-size:12px;color:var(--text4)">${ts.members.length-1} 位下级成员</span></div><div class="team-list">${ts.members.map(m=>`<div class="team-item ${m.id===state.selectedId?'self':''}"><div class="team-avatar">${m.id===state.selectedId?'✓':'↓'}</div><div class="team-info"><div class="team-name ${m.id===state.selectedId?'self':''}">${escHtml(m.name)}${m.id===state.selectedId?' <span style="font-size:10px;font-weight:400;opacity:0.7">(本人)</span>':''}</div><div class="team-detail">${m.count} 笔交易</div></div><div class="team-amount">${formatCurrency(m.amount)}</div></div>`).join('')}</div><div class="team-total"><span class="label">团队总销售额</span><span class="value">${formatCurrency(ts.total)}</span></div></div>`:''}`}
function setFilter(t){state.filterType=t;if(t!=='custom')state.customRange=null;renderDetail()}
function setCustomDate(which,val){if(!state.customRange)state.customRange=['',''];state.customRange[which==='start'?0:1]=val}
function applyCustom(){if(state.customRange&&state.customRange[0]&&state.customRange[1]){renderDetail()}}
function deleteSale(id){const sale=state.sales.find(s=>s.id===id);if(!sale)return;state.undoAction={type:'sale',data:sale};if(state.undoTimer)clearTimeout(state.undoTimer);state.undoTimer=setTimeout(()=>{state.undoAction=null},30000);state.sales=state.sales.filter(s=>s.id!==id);saveSales();renderTree();renderDetail();showToast(`已删除「${sale.productName}」`,'撤销',undoDelete)}
function undoDelete(){if(!state.undoAction)return;if(state.undoAction.type==='sale'){state.sales.push(state.undoAction.data);saveSales()}else if(state.undoAction.type==='customer'){state.customers.push(...state.undoAction.data.customers);state.sales.push(...state.undoAction.data.sales);saveCustomers();saveSales()}state.undoAction=null;if(state.undoTimer)clearTimeout(state.undoTimer);hideToast();renderTree();renderDetail()}
function openAddCustomer(){const modal=document.getElementById('modalContainer');const parents=state.customers;modal.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal animate-in"><div class="modal-header"><h3>新增客户</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-group"><label class="form-label">客户名称 *</label><input type="text" class="form-input" id="custName" placeholder="请输入客户名称" autofocus></div><div class="form-group"><label class="form-label">上级客户（可搜索）</label><div class="search-wrapper"><input type="text" class="form-input" id="custParent" placeholder="输入名称搜索..." oninput="showParentResults(this.value)" onfocus="showParentResults(this.value)"><div id="parentResults" class="search-results" style="display:none"></div></div></div><div class="initial-sale"><div class="initial-sale-header"><span>💰</span><span>初始销售额（可选）</span></div><div class="grid-2"><input type="text" class="form-input" id="initProduct" placeholder="产品名称" style="font-size:13px"><input type="number" class="form-input" id="initAmount" placeholder="金额 ¥" style="font-size:13px"></div></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitAddCustomer()">确认添加</button></div></div></div></div>`;window.selectedParentId=null}
function showParentResults(q){const div=document.getElementById('parentResults');if(!q){div.style.display='none';return}const matches=state.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));if(matches.length===0&&q.trim()){div.innerHTML=`<div class="search-result" onclick="clearParent()">清除选择</div>`;div.style.display='block'}else if(matches.length>0){div.innerHTML=matches.map(c=>`<div class="search-result" onclick="selectParent('${c.id}','${escHtml(c.name)}')">${escHtml(c.name)}</div>`).join('')+'<div class="search-result" onclick="clearParent()">清除选择</div>';div.style.display='block'}}
function selectParent(id,name){document.getElementById('custParent').value=name;window.selectedParentId=id;document.getElementById('parentResults').style.display='none'}
function clearParent(){document.getElementById('custParent').value='';window.selectedParentId=null;document.getElementById('parentResults').style.display='none'}
function submitAddCustomer(){const name=document.getElementById('custName').value.trim();if(!name)return;const c={id:genId(),name,parentId:window.selectedParentId||null};state.customers.push(c);saveCustomers();if(document.getElementById('initProduct').value.trim()&&document.getElementById('initAmount').value){const amt=parseFloat(document.getElementById('initAmount').value);if(!isNaN(amt)&&amt>0){state.sales.push({id:genId(),customerId:c.id,productName:document.getElementById('initProduct').value.trim(),amount:amt,date:new Date().toISOString()});saveSales()}}closeModal();renderTree();state.selectedId=c.id;renderDetail()}
function openAddSale(){const modal=document.getElementById('modalContainer');modal.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal animate-in"><div class="modal-header"><h3>新增销售记录</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-group"><label class="form-label">客户名称 *</label><div class="search-wrapper"><input type="text" class="form-input" id="saleCustomer" placeholder="输入或搜索客户..." oninput="showCustomerResults(this.value)" onfocus="showCustomerResults(this.value)"><div id="customerResults" class="search-results" style="display:none"></div></div></div><div class="form-row"><div class="form-group"><label class="form-label">产品名称 *</label><input type="text" class="form-input" id="saleProduct" placeholder="产品名称"></div><div class="form-group"><label class="form-label">销售日期</label><input type="date" class="form-input" id="saleDate" value="${new Date().toISOString().split('T')[0]}"></div></div><div class="form-group"><label class="form-label">销售金额 (¥) *</label><input type="number" class="form-input" id="saleAmount" placeholder="0.00" step="0.01" min="0"></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-amber" onclick="submitAddSale()" style="background:linear-gradient(135deg,var(--amber),#f97316)">确认录入</button></div></div></div></div>`;window.selectedSaleCustomerId=null}
function showCustomerResults(q){const div=document.getElementById('customerResults');if(!q){div.style.display='none';return}const matches=state.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));if(matches.length===0&&q.trim()){div.innerHTML=`<div class="search-result new" onclick="createAndSelectCustomer('${escHtml(q)}')">➕ 新建客户「${escHtml(q)}」</div>`;div.style.display='block'}else{let html=matches.map(c=>`<div class="search-result" onclick="selectSaleCustomer('${c.id}','${escHtml(c.name)}')">${escHtml(c.name)}</div>`).join('');if(q.trim())html+=`<div class="search-result new" onclick="createAndSelectCustomer('${escHtml(q)}')">➕ 新建客户「${escHtml(q)}」</div>`;div.innerHTML=html;div.style.display='block'}}
function selectSaleCustomer(id,name){document.getElementById('saleCustomer').value=name;window.selectedSaleCustomerId=id;document.getElementById('customerResults').style.display='none'}
function createAndSelectCustomer(name){const c={id:genId(),name:name.trim(),parentId:null};state.customers.push(c);saveCustomers();selectSaleCustomer(c.id,name);document.getElementById('customerResults').style.display='none'}
function submitAddSale(){const cid=window.selectedSaleCustomerId;const product=document.getElementById('saleProduct').value.trim();const amount=parseFloat(document.getElementById('saleAmount').value);const date=document.getElementById('saleDate').value;if(!cid||!product||isNaN(amount)||amount<=0)return;state.sales.push({id:genId(),customerId:cid,productName:product,amount,date:new Date(date).toISOString()});saveSales();closeModal();renderTree();if(state.selectedId===cid)renderDetail()}
function confirmDelete(id,name){const modal=document.getElementById('modalContainer');const descIds=getDescendantIds(id);const hasChildren=descIds.size>1;modal.innerHTML=`<div class="modal-overlay confirm-modal" onclick="if(event.target===this)closeModal()"><div class="modal animate-in"><div class="modal-body" style="text-align:center;padding:24px"><div class="confirm-icon">⚠️</div><h3 class="confirm-title">确定删除吗？</h3><p class="confirm-name">${escHtml(name)}</p>${hasChildren?'<p class="confirm-text">将同时删除其所有下级成员及关联的销售数据</p>':'<p class="confirm-text">此操作不可恢复</p>'}<div class="confirm-actions"><button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-delete" onclick="doDelete('${id}')">确认删除</button></div></div></div></div>`}
function doDelete(id){const dids=getDescendantIds(id);const target=state.customers.find(c=>c.id===id);const delCustomers=state.customers.filter(c=>dids.has(c.id));const delSales=state.sales.filter(s=>dids.has(s.customerId));state.undoAction={type:'customer',data:{customers:delCustomers,sales:delSales}};if(state.undoTimer)clearTimeout(state.undoTimer);state.undoTimer=setTimeout(()=>{state.undoAction=null},30000);state.customers=state.customers.filter(c=>!dids.has(c.id));state.sales=state.sales.filter(s=>!dids.has(s.customerId));saveCustomers();saveSales();if(state.selectedId&&dids.has(state.selectedId))state.selectedId=null;closeModal();renderTree();renderDetail();showToast(`已删除「${target?.name}」`,'撤销',undoDelete)}
function showToast(text,btnText,onClick){const tc=document.getElementById('toastContainer');tc.innerHTML=`<div class="toast animate-in"><span class="toast-text">${text}</span><button class="toast-action" onclick="(${onClick.toString()})()">${btnText}</button><button class="toast-close" onclick="hideToast()">✕</button></div>`}
function hideToast(){document.getElementById('toastContainer').innerHTML=''}
function closeModal(){document.getElementById('modalContainer').innerHTML=''}
function exportCSV(){if(!state.selectedId)return;const ps=getPersonalSales(state.selectedId);const c=state.customers.find(x=>x.id===state.selectedId);let csv='\uFEFF客户名称,产品名称,销售金额(元),销售日期\n';ps.forEach(s=>{csv+=`"${c?.name||''}","${s.productName}",${s.amount},"${formatDate(s.date)}"\n`});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${c?.name||'销售数据'}.csv`;a.click();URL.revokeObjectURL(a.href)}
function handleGlobalSearch(q){if(!q.trim()){renderTree();return}const matches=state.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));if(matches.length===1){selectCustomer(matches[0].id)}else if(matches.length>1){const tree=document.getElementById('customerTree');tree.innerHTML='<div style="padding:8px"><div style="font-size:11px;color:var(--text4);margin-bottom:8px">搜索结果:</div>'+matches.map(m=>`<div class="tree-item" onclick="selectCustomer('${m.id}')">📍 ${escHtml(m.name)}</div>`).join('')+'</div>'}}
function openSnapshotPanel(){document.getElementById('snapshotPanel').style.display='flex';renderSnapshots()}
function closeSnapshotPanel(){document.getElementById('snapshotPanel').style.display='none'}
function loadSnapshots(){try{return JSON.parse(localStorage.getItem(STORAGE_KEYS.SNAPSHOTS))||[]}catch{return[]}}
function saveSnapshots(s){localStorage.setItem(STORAGE_KEYS.SNAPSHOTS,JSON.stringify(s))}
function createSnapshot(){const name=prompt('请输入快照名称:');if(!name||!name.trim())return;const snaps=loadSnapshots();const snap={id:genId(),name:name.trim(),createdAt:new Date().toISOString(),customers:[...state.customers],sales:[...state.sales],customerCount:state.customers.length,saleCount:state.sales.length};snaps.unshift(snap);if(snaps.length>20)snaps.pop();saveSnapshots(snaps);renderSnapshots()}
function renderSnapshots(){const list=document.getElementById('snapshotList');const snaps=loadSnapshots();if(snaps.length===0){list.innerHTML='<div class="snapshot-empty"><div class="snapshot-empty-icon">📷</div><p>暂无快照记录</p><p style="font-size:11px;margin-top:4px">点击上方按钮保存当前数据状态</p></div>';return}list.innerHTML=snaps.map(s=>`<div class="snapshot-item"><div class="snapshot-name">${escHtml(s.name)}</div><div class="snapshot-time">${formatDate(s.createdAt)} ${new Date(s.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div><div class="snapshot-stats"><span class="snapshot-stat green">${s.customerCount} 客户</span><span class="snapshot-stat blue">${s.saleCount} 销售</span></div><div class="snapshot-actions"><button class="restore" onclick="restoreSnapshot('${s.id}')">🔄 恢复</button><button class="delete-btn-action" onclick="deleteSnapshot('${s.id}')">🗑 删除</button></div></div>`).join('')}
function restoreSnapshot(id){if(!confirm('确定恢复此快照？当前数据将被覆盖。'))return;const snaps=loadSnapshots();const snap=snaps.find(s=>s.id===id);if(!snap)return;state.customers=snap.customers;state.sales=snap.sales;state.selectedId=null;saveCustomers();saveSales();closeSnapshotPanel();renderTree();renderDetail()}
function deleteSnapshot(id){if(!confirm('确定删除此快照？'))return;let snaps=loadSnapshots();snaps=snaps.filter(s=>s.id!==id);saveSnapshots(snaps);renderSnapshots()}
load();renderTree();
document.addEventListener('click',function(e){if(!e.target.closest('.search-wrapper')){document.querySelectorAll('.search-results').forEach(el=>el.style.display='none')}});
</script>
</body>
